name: Build and Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      CADDY_VERSION:
        required: false
        description: "Caddy version (e.g. 2.11.7). Leave empty to auto-detect latest release."
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "Caddyfile.example"
      - "healthcheck.go"
      - ".github/workflows/build-docker.yml"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  schedule:
    # Rebuild weekly (Monday 04:00 UTC) to pick up new Caddy releases and patched Go dependencies.
    # The published runtime is FROM scratch, so Alpine package updates never ship in the image.
    - cron: "0 4 * * 1"

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_REPO: lostinfuture/caddy-webdav
  GHCR_REPO: ghcr.io/lostinfuture/caddy-webdav
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Caddy version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.CADDY_VERSION }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DEFAULT_VERSION=$(grep -E '^ARG CADDY_VERSION=' Dockerfile | head -n1 | cut -d= -f2)

          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          else
            LATEST_TAG=$(gh api repos/caddyserver/caddy/releases/latest --jq '.tag_name' || echo "")
            CANDIDATE="${LATEST_TAG#v}"
            if [ -n "${CANDIDATE}" ] && docker manifest inspect "caddy:${CANDIDATE}-alpine" >/dev/null 2>&1; then
              VERSION="${CANDIDATE}"
            else
              VERSION="${DEFAULT_VERSION}"
            fi
          fi

          MAJOR_MINOR="${VERSION%.*}"
          MAJOR="${VERSION%%.*}"

          echo "Resolved Caddy version: ${VERSION}"
          echo "CADDY_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "CADDY_MAJOR_MINOR=${MAJOR_MINOR}" >> "$GITHUB_ENV"
          echo "CADDY_MAJOR=${MAJOR}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "${DOCKER_PASSWORD}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "username=${DOCKER_USERNAME:-lostinfuture}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "username=lostinfuture" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKER_PASSWORD secret is not set; publishing to GHCR only."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare image tags
        id: tags
        run: |
          set -euo pipefail
          DOCKER_USER="${{ steps.dockerhub.outputs.username }}"
          DH_IMAGE="${DOCKER_USER}/caddy-webdav"
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/caddy-webdav"

          TAGS=(
            "${GHCR_IMAGE}:${CADDY_VERSION}"
            "${GHCR_IMAGE}:v${CADDY_VERSION}"
            "${GHCR_IMAGE}:${CADDY_MAJOR_MINOR}"
            "${GHCR_IMAGE}:${CADDY_MAJOR}"
            "${GHCR_IMAGE}:latest"
          )

          if [ "${{ steps.dockerhub.outputs.enabled }}" = "true" ]; then
            TAGS+=(
              "${DH_IMAGE}:${CADDY_VERSION}"
              "${DH_IMAGE}:v${CADDY_VERSION}"
              "${DH_IMAGE}:${CADDY_MAJOR_MINOR}"
              "${DH_IMAGE}:${CADDY_MAJOR}"
              "${DH_IMAGE}:latest"
            )
          fi

          printf -v TAG_ARGS ' --tag %s' "${TAGS[@]}"
          echo "TAG_ARGS=${TAG_ARGS}" >> "$GITHUB_ENV"

      - name: Build and push multi-arch image
        run: |
          docker buildx build \
            --build-arg CADDY_VERSION="${CADDY_VERSION}" \
            --platform "${PLATFORMS}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --provenance=true \
            --sbom=true \
            ${TAG_ARGS} \
            --push .

      # amd64 is requested during the build (PROPFIND + a byte range).
      # These two cannot run inside the cross-compile stage, so run them here.
      - name: Run arm binaries under QEMU
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/caddy-webdav:${CADDY_VERSION}"
          for platform in linux/arm64 linux/arm/v7; do
            docker run --rm --platform "${platform}" "${IMAGE}" caddy version
            docker run --rm --platform "${platform}" "${IMAGE}" /usr/bin/healthcheck version
          done

      - name: Update Docker Hub Description
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ steps.dockerhub.outputs.username }}/caddy-webdav
