services:
  caddy-webdav:
    image: lostinfuture/caddy-webdav:latest
    # Or from GitHub Container Registry:
    # image: ghcr.io/lostinfuture/caddy-webdav:latest
    container_name: caddy-webdav
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Soft memory limit for Go runtime during heavy 4K Remux streaming / library indexing (baked into image as 512MiB by default)
      - GOMEMLIMIT=512MiB
      # Access log destination: `stdout` (default), `stderr`, `discard` (disable), or `file /data/access.log`
      - ACCESS_LOG_OUTPUT=stdout
      # Log format for both runtime and access logs: `json` (default) or `console`
      - ACCESS_LOG_FORMAT=json
    volumes:
      # Place your Caddyfile at /path/to/caddy/conf/Caddyfile on the host
      - /path/to/caddy/conf:/etc/caddy
      - /path/to/caddy/data:/data
      - /path/to/media:/var/media
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
