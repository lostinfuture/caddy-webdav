services:
  caddy-webdav:
    image: lostinfuture/caddy-webdav:latest
    # Or from GitHub Container Registry:
    # image: ghcr.io/lostinfuture/caddy-webdav:latest
    container_name: caddy-webdav
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Soft memory limit for Go runtime during heavy 4K Remux streaming / library indexing (baked into image as 512MiB by default)
      - GOMEMLIMIT=512MiB
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./media:/var/media
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
